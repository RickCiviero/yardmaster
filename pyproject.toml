[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yardmaster"
version = "1.1.0"
description = "Route each AI coding task to the weakest model that does it well."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "coding-agents", "model-routing", "claude-code", "codex", "github-copilot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/RickCiviero/yardmaster"
Documentation = "https://github.com/RickCiviero/yardmaster/wiki"
Issues = "https://github.com/RickCiviero/yardmaster/issues"
Security = "https://github.com/RickCiviero/yardmaster/blob/main/SECURITY.md"

[project.scripts]
yardmaster = "yardmaster.cli:main"

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "pyyaml", "tzdata", "ruff", "bandit", "pip-audit", "cyclonedx-bom"]

[tool.setuptools]
package-dir = { "" = "skills/yardmaster/scripts" }
packages = ["yardmaster", "yardmaster.collectors", "yardmaster.writers"]
package-data = { "yardmaster" = ["models.json"] }

[tool.pytest.ini_options]
pythonpath = ["skills/yardmaster/scripts", "tools"]
testpaths = ["tests"]
markers = ["pentest: penetration-test cases", "fuzz: property-based fuzzing"]

[tool.ruff]
target-version = "py311"
line-length = 150
extend-exclude = ["reference"]

[tool.bandit]
exclude_dirs = ["tests", "reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"skills/yardmaster/scripts/yardmaster/redact.py" = ["E501"]  # regex tables read better unwrapped
"tests/*" = ["E501"]
"tests/*/*" = ["E501"]
