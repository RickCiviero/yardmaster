version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(dev)"
  - package-ecosystem: npm
    directory: /.github/install-check
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(ci)"
